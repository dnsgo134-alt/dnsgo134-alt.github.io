<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 가계부 대시보드</title>
  <!-- Pretendard 폰트 & Chart.js & 아이콘 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #191f28;
      --text-sub: #6b7684;
      --primary: #3182f6;
      --primary-soft: #e8f3ff;
      --income: #00b894;
      --expense: #f04452;
      --warning: #f59e0b;
      --border: #e5e8eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* 상단 헤더 & 연/월 네비게이션 + 백업/복원 바 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--card);
      padding: 18px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
    }

    /* 연/월 이동 컨트롤러 */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .nav-btn {
      background: #f2f4f6;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
      transition: 0.15s;
    }

    .nav-btn:hover {
      background: #e5e8eb;
    }

    .current-month-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(49, 130, 246, 0.2);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 연/월 퀵 피커 팝오버 */
    .picker-popover {
      display: none;
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      padding: 16px;
      width: 280px;
      z-index: 100;
    }

    .picker-popover.active {
      display: block;
    }

    .picker-year-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .picker-months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .picker-month-item {
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .picker-month-item.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 우측 액션 버튼들 (백업 / 복원 / 초기화) */
    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-backup {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-backup:hover {
      background: #1b64da;
    }

    .btn-restore {
      background: var(--income);
      color: #ffffff;
    }

    .btn-restore:hover {
      background: #00997a;
    }

    .btn-outline {
      background: #f2f4f6;
      color: var(--text-sub);
    }

    .btn-outline:hover {
      background: #e5e8eb;
      color: var(--text);
    }

    /* 요약 카드 4종 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--card);
      padding: 20px 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .summary-label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
    }

    .text-income { color: var(--income); }
    .text-expense { color: var(--expense); }
    .text-primary { color: var(--primary); }

    .budget-bar-bg {
      width: 100%;
      height: 8px;
      background: #edf0f5;
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }

    .budget-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* 메인 레이아웃 (달력 & 차트) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 960px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      padding: 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* 달력 스타일 */
    .calendar-weekdays, .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding-bottom: 8px;
    }

    .cal-day {
      min-height: 68px;
      border: 1px solid #f0f2f5;
      border-radius: 10px;
      padding: 6px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cal-day:hover {
      border-color: var(--primary);
      background: #f9fbff;
    }

    .cal-day.selected {
      border: 2px solid var(--primary);
      background: var(--primary-soft);
    }

    .cal-day.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .cal-date-num {
      font-size: 12px;
      font-weight: 700;
    }

    .cal-amounts {
      font-size: 11px;
      line-height: 1.3;
      text-align: right;
    }

    /* 하단 입력 폼 & 내역 리스트 레이아웃 */
    .bottom-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .type-btn.active-expense {
      background: #fff0f1;
      color: var(--expense);
      border-color: var(--expense);
    }

    .type-btn.active-income {
      background: #e6fcf5;
      color: var(--income);
      border-color: var(--income);
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* 거래 내역 리스트 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tx-list {
      max-height: 420px;
      overflow-y: auto;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #f2f4f6;
    }

    .tx-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-title {
      font-weight: 600;
      font-size: 14px;
    }

    .tx-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 15px;
    }

    .del-btn {
      background: none;
      border: none;
      color: #b0b8c1;
      cursor: pointer;
      font-size: 16px;
    }

    .del-btn:hover {
      color: var(--expense);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더: 브랜드 / 연월 이동 / 데이터 백업·복원 버튼 -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">₩</div>
      <div>
        <h1>스마트 가계부</h1>
      </div>
    </div>

    <!-- 연도 및 월 빠른 이동 컨트롤러 -->
    <div class="month-nav">
      <button class="nav-btn" onclick="changeYear(-1)" title="1년 전">«</button>
      <button class="nav-btn" onclick="changeMonth(-1)" title="이전 달">‹</button>
      <button class="current-month-btn" id="currentMonthLabel" onclick="toggleMonthPicker()">2026년 10월</button>
      <button class="nav-btn" onclick="changeMonth(1)" title="다음 달">›</button>
      <button class="nav-btn" onclick="changeYear(1)" title="1년 후">»</button>
      <button class="nav-btn" onclick="goToThisMonth()">이번 달</button>

      <!-- 연/월 선택 팝오버 -->
      <div class="picker-popover" id="monthPickerPopover">
        <div class="picker-year-row">
          <button class="nav-btn" onclick="changePickerYear(-1)">‹</button>
          <span id="pickerYearTitle">2026년</span>
          <button class="nav-btn" onclick="changePickerYear(1)">›</button>
        </div>
        <div class="picker-months-grid" id="pickerMonthsGrid"></div>
      </div>
    </div>

   <!-- 우측 상단 액션 버튼 영역 (백업 / 복원 / 샘플 복원 / 내역 추가) -->
<div class="flex items-center gap-2">
  <!-- 1. 데이터 백업 버튼 -->
  <button onclick="exportLedgerData()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 transition">
    💾 데이터 백업
  </button>

  <!-- 2. 데이터 복원 버튼 -->
  <button onclick="document.getElementById('restoreFileInput').click()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 transition">
    📂 데이터 복원
  </button>
  <input type="file" id="restoreFileInput" accept=".json" class="hidden" style="display:none;" onchange="importLedgerData(event)" />

  <!-- 기존 샘플 복원 버튼 -->
  <button onclick="resetToSample()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 transition">
    ↻ 샘플 복원
  </button>

  <!-- 기존 + 내역 추가 버튼 -->
  <button onclick="scrollToForm()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition">
    + 내역 추가
  </button>
  
</div>
  <!-- 상단 요약 카드 4개 -->
  <section class="summary-grid">
    <div class="summary-card">
      <div class="summary-label">이번 달 총 수입</div>
      <div class="summary-value text-income" id="totalIncome">0원</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">이번 달 총 지출</div>
      <div class="summary-value text-expense" id="totalExpense">0원</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">순수익 (잔액)</div>
      <div class="summary-value text-primary" id="netBalance">0원</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">
        <span>월 목표 예산 달성률</span>
        <button class="btn-outline" style="border:none; padding:2px 8px; border-radius:6px; cursor:pointer; font-size:11px;" onclick="editBudget()">예산 변경</button>
      </div>
      <div class="summary-value" id="budgetPercent" style="font-size:20px;">0%</div>
      <div class="budget-bar-bg">
        <div class="budget-bar-fill" id="budgetBarFill" style="width: 0%;"></div>
      </div>
    </div>
  </section>

  <!-- 중단: 월간 달력 & 카테고리별 도넛 차트 -->
  <section class="dashboard-grid">
    <div class="card">
      <div class="card-header">
        <span class="card-title">📅 월간 소비 달력 (날짜 클릭 시 필터링)</span>
        <button class="btn btn-outline" id="clearDateFilterBtn" style="display:none; padding:4px 10px;" onclick="selectDate(null)">전체 날짜 보기</button>
      </div>
      <div class="calendar-weekdays">
        <div style="color:#f04452;">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color:#3182f6;">토</div>
      </div>
      <div class="calendar-days" id="calendarDaysGrid"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">📊 카테고리별 지출 비중</span>
      </div>
      <div style="height: 280px; display:flex; align-items:center; justify-content:center;">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
  </section>

  <!-- 하단: 내역 추가 폼 & 상세 리스트 -->
  <section class="bottom-grid">
    <!-- 좌측: 빠른 내역 추가 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">✍️ 빠른 내역 기록</span>
      </div>
      <div class="type-toggle">
        <button type="button" class="type-btn active-expense" id="btnTypeExpense" onclick="setTxType('expense')">지출 (-)</button>
        <button type="button" class="type-btn" id="btnTypeIncome" onclick="setTxType('income')">수입 (+)</button>
      </div>
      <form onsubmit="addTransaction(event)">
        <div class="form-group">
          <label>날짜</label>
          <input type="date" id="txDate" class="form-control" required />
        </div>
        <div class="form-group">
          <label>카테고리</label>
          <select id="txCategory" class="form-control">
            <option value="식비">식비</option>
            <option value="주거/통신">주거/통신</option>
            <option value="쇼핑">쇼핑</option>
            <option value="문화/여가">문화/여가</option>
            <option value="교통">교통</option>
            <option value="급여/수입">급여/수입</option>
            <option value="저축/기타">저축/기타</option>
          </select>
        </div>
        <div class="form-group">
          <label>내용</label>
          <input type="text" id="txDesc" class="form-control" placeholder="예: 스타벅스, 대형마트 장보기" required />
        </div>
        <div class="form-group">
          <label>금액 (원)</label>
          <input type="number" id="txAmount" class="form-control" placeholder="금액 입력" required min="1" />
        </div>
        <button type="submit" class="submit-btn">내역 추가하기</button>
      </form>
    </div>

    <!-- 우측: 거래 내역 조회 및 검색 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">🧾 상세 거래 내역</span>
        <span id="txCountBadge" style="font-size:13px; color:var(--text-sub); font-weight:600;">총 0건</span>
      </div>
      <div class="filter-bar">
        <input type="text" id="searchInput" class="form-control" style="flex:1;" placeholder="내용 또는 카테고리 검색..." oninput="renderAll()" />
      </div>
      <div class="tx-list" id="txListContainer"></div>
    </div>
  </section>
</div>

<script>
  // =========================================================================
  // 1. 고정 로컬 스토리지 키 설정 (코드를 수정해도 이 키 이름만 유지하면 데이터가 보존됩니다)
  // =========================================================================
  const STORAGE_KEY = 'SMART_LEDGER_PERSISTENT_STORAGE';

  // 기본 샘플 데이터
  const DEFAULT_DATA = {
    budget: 2000000,
    transactions: [
      { id: 1, date: '2026-10-01', type: 'income', category: '급여/수입', desc: '10월 급여 입금', amount: 4200000 },
      { id: 2, date: '2026-10-03', type: 'expense', category: '주거/통신', desc: '아파트 관리비 및 통신비', amount: 285000 },
      { id: 3, date: '2026-10-05', type: 'expense', category: '식비', desc: '주말 마트 장보기', amount: 142000 },
      { id: 4, date: '2026-10-09', type: 'expense', category: '문화/여가', desc: '미술관 전시 관람 및 카페', amount: 68000 },
      { id: 5, date: '2026-10-12', type: 'expense', category: '쇼핑', desc: '가을 의류 및 생활용품 구매', amount: 189000 },
      { id: 6, date: '2026-10-14', type: 'expense', category: '교통', desc: '주유비 및 하이패스 충전', amount: 95000 }
    ]
  };

  let appState = {
    currentYear: 2026,
    currentMonth: 10, // 1 ~ 12
    pickerYear: 2026,
    selectedDate: null,
    txType: 'expense',
    budget: 2000000,
    transactions: []
  };

  let categoryChartInstance = null;

  // 초기 실행
  window.addEventListener('DOMContentLoaded', () => {
    loadFromStorage();
    document.getElementById('txDate').value = `${appState.currentYear}-${String(appState.currentMonth).padStart(2, '0')}-14`;
    renderAll();
  });

  // 저장소에서 데이터 불러오기
  function loadFromStorage() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        appState.budget = parsed.budget || 2000000;
        appState.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
        return;
      } catch (e) {
        console.error('저장소 읽기 오류:', e);
      }
    }
    // 저장된 데이터가 없으면 초기 샘플 적용
    appState.budget = DEFAULT_DATA.budget;
    appState.transactions = [...DEFAULT_DATA.transactions];
    saveToStorage();
  }

  // 저장소에 현재 상태 저장
  function saveToStorage() {
    const payload = {
      budget: appState.budget,
      transactions: appState.transactions,
      updatedAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload, null, 2));
  }

  // =========================================================================
  // 2. 요청하신 백업(다운로드) 및 복원(불러오기) 핵심 함수
  // =========================================================================

  // [백업] 현재 가계부 데이터를 JSON 파일로 다운로드
  function exportLedgerData() {
    saveToStorage(); // 최신 상태 먼저 저장
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (!savedData) {
      alert('백업할 가계부 데이터가 없습니다.');
      return;
    }

    const blob = new Blob([savedData], { type: 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0, 10);

    a.href = url;
    a.download = `가계부_백업_${today}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // [복원] 업로드한 JSON 백업 파일을 읽어서 가계부에 즉시 복원
  function importLedgerData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);

        // 배열 형태로만 저장된 백업이거나 객체 형태인 경우 모두 호환 처리
        const restoredTransactions = Array.isArray(parsed)
          ? parsed
          : (Array.isArray(parsed.transactions) ? parsed.transactions : null);

        if (!restoredTransactions) {
          alert('올바른 가계부 백업 파일(.json) 형식이 아닙니다.');
          return;
        }

        const restoredPayload = {
          budget: parsed.budget || appState.budget || 2000000,
          transactions: restoredTransactions,
          updatedAt: new Date().toISOString()
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(restoredPayload, null, 2));
        loadFromStorage();
        renderAll();

        alert(`데이터 복원이 완료되었습니다! (총 ${restoredTransactions.length}건의 내역)`);
      } catch (err) {
        alert('올바른 백업 파일(.json)이 아닙니다.');
      } finally {
        event.target.value = ''; // 동일 파일 재업로드 가능하도록 초기화
      }
    };
    reader.readAsText(file);
  }

  // 샘플 데이터로 초기화
  function resetSampleData() {
    if (!confirm('현재 내역을 초기 샘플 데이터로 되돌리시겠습니까?')) return;
    appState.budget = DEFAULT_DATA.budget;
    appState.transactions = [...DEFAULT_DATA.transactions];
    saveToStorage();
    renderAll();
  }

  // =========================================================================
  // 3. 연도/월 이동 및 달력/차트/내역 렌더링 함수
  // =========================================================================
  function getYearMonthPrefix() {
    return `${appState.currentYear}-${String(appState.currentMonth).padStart(2, '0')}`;
  }

  function changeMonth(delta) {
    appState.currentMonth += delta;
    if (appState.currentMonth > 12) {
      appState.currentMonth = 1;
      appState.currentYear++;
    } else if (appState.currentMonth < 1) {
      appState.currentMonth = 12;
      appState.currentYear--;
    }
    appState.selectedDate = null;
    syncDateInput();
    renderAll();
  }

  function changeYear(delta) {
    appState.currentYear += delta;
    appState.selectedDate = null;
    syncDateInput();
    renderAll();
  }

  function goToThisMonth() {
    appState.currentYear = 2026;
    appState.currentMonth = 10;
    appState.selectedDate = null;
    syncDateInput();
    renderAll();
  }

  function toggleMonthPicker() {
    const popover = document.getElementById('monthPickerPopover');
    appState.pickerYear = appState.currentYear;
    renderMonthPicker();
    popover.classList.toggle('active');
  }

  function changePickerYear(delta) {
    appState.pickerYear += delta;
    renderMonthPicker();
  }

  function renderMonthPicker() {
    document.getElementById('pickerYearTitle').textContent = `${appState.pickerYear}년`;
    const grid = document.getElementById('pickerMonthsGrid');
    grid.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
      const btn = document.createElement('button');
      btn.className = 'picker-month-item' + (appState.pickerYear === appState.currentYear && m === appState.currentMonth ? ' selected' : '');
      btn.textContent = `${m}월`;
      btn.onclick = () => {
        appState.currentYear = appState.pickerYear;
        appState.currentMonth = m;
        appState.selectedDate = null;
        document.getElementById('monthPickerPopover').classList.remove('active');
        syncDateInput();
        renderAll();
      };
      grid.appendChild(btn);
    }
  }

  function syncDateInput() {
    document.getElementById('txDate').value = `${getYearMonthPrefix()}-01`;
  }

  function selectDate(dateStr) {
    appState.selectedDate = appState.selectedDate === dateStr ? null : dateStr;
    if (appState.selectedDate) {
      document.getElementById('txDate').value = appState.selectedDate;
    }
    renderAll();
  }

  function setTxType(type) {
    appState.txType = type;
    document.getElementById('btnTypeExpense').className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
    document.getElementById('btnTypeIncome').className = 'type-btn' + (type === 'income' ? ' active-income' : '');
  }

  function addTransaction(e) {
    e.preventDefault();
    const date = document.getElementById('txDate').value;
    const category = document.getElementById('txCategory').value;
    const desc = document.getElementById('txDesc').value.trim();
    const amount = Number(document.getElementById('txAmount').value);

    if (!date || !desc || !amount) return;

    appState.transactions.unshift({
      id: Date.now(),
      date,
      type: appState.txType,
      category,
      desc,
      amount
    });

    // 입력한 날짜의 연/월로 자동 이동
    const [y, m] = date.split('-').map(Number);
    appState.currentYear = y;
    appState.currentMonth = m;

    saveToStorage();
    document.getElementById('txDesc').value = '';
    document.getElementById('txAmount').value = '';
    renderAll();
  }

  function deleteTransaction(id) {
    appState.transactions = appState.transactions.filter(t => t.id !== id);
    saveToStorage();
    renderAll();
  }

  function editBudget() {
    const input = prompt('이번 달 목표 예산을 입력하세요 (원):', appState.budget);
    if (input !== null && !isNaN(Number(input)) && Number(input) > 0) {
      appState.budget = Number(input);
      saveToStorage();
      renderAll();
    }
  }

  function renderAll() {
    const prefix = getYearMonthPrefix();
    document.getElementById('currentMonthLabel').textContent = `${appState.currentYear}년 ${appState.currentMonth}월`;

    // 해당 월 데이터 필터링
    const monthTxs = appState.transactions.filter(t => t.date.startsWith(prefix));

    // 요약 수치 계산
    const income = monthTxs.filter(t => t.type === 'income').reduce((acc, c) => acc + c.amount, 0);
    const expense = monthTxs.filter(t => t.type === 'expense').reduce((acc, c) => acc + c.amount, 0);
    const net = income - expense;
    const ratio = appState.budget > 0 ? Math.round((expense / appState.budget) * 100) : 0;

    document.getElementById('totalIncome').textContent = `+${income.toLocaleString()}원`;
    document.getElementById('totalExpense').textContent = `-${expense.toLocaleString()}원`;
    document.getElementById('netBalance').textContent = `${net >= 0 ? '+' : ''}${net.toLocaleString()}원`;
    document.getElementById('budgetPercent').textContent = `${ratio}% (${expense.toLocaleString()} / ${appState.budget.toLocaleString()}원)`;

    const bar = document.getElementById('budgetBarFill');
    bar.style.width = `${Math.min(ratio, 100)}%`;
    bar.style.background = ratio > 100 ? 'var(--expense)' : (ratio > 80 ? 'var(--warning)' : 'var(--primary)');

    renderCalendar(monthTxs);
    renderChart(monthTxs);
    renderList(monthTxs);
  }

  function renderCalendar(monthTxs) {
    const grid = document.getElementById('calendarDaysGrid');
    grid.innerHTML = '';

    document.getElementById('clearDateFilterBtn').style.display = appState.selectedDate ? 'inline-block' : 'none';

    const firstDay = new Date(appState.currentYear, appState.currentMonth - 1, 1).getDay();
    const lastDate = new Date(appState.currentYear, appState.currentMonth, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${getYearMonthPrefix()}-${String(d).padStart(2, '0')}`;
      const dayTxs = monthTxs.filter(t => t.date === dateStr);
      const dInc = dayTxs.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
      const dExp = dayTxs.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);

      const cell = document.createElement('div');
      cell.className = 'cal-day' + (appState.selectedDate === dateStr ? ' selected' : '');
      cell.onclick = () => selectDate(dateStr);

      cell.innerHTML = `
        <div class="cal-date-num">${d}</div>
        <div class="cal-amounts">
          ${dInc > 0 ? `<div class="text-income">+${(dInc / 10000).toFixed(1)}만</div>` : ''}
          ${dExp > 0 ? `<div class="text-expense">-${(dExp / 10000).toFixed(1)}만</div>` : ''}
        </div>
      `;
      grid.appendChild(cell);
    }
  }

  function renderChart(monthTxs) {
    const ctx = document.getElementById('categoryChart').getContext('2d');
    const expenses = monthTxs.filter(t => t.type === 'expense');
    const map = {};
    expenses.forEach(t => {
      map[t.category] = (map[t.category] || 0) + t.amount;
    });

    const labels = Object.keys(map);
    const values = Object.values(map);

    if (categoryChartInstance) categoryChartInstance.destroy();

    categoryChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels.length ? labels : ['지출 내역 없음'],
        datasets: [{
          data: values.length ? values : [1],
          backgroundColor: values.length
            ? ['#3182f6', '#00b894', '#f59e0b', '#f04452', '#8b5cf6', '#64748b']
            : ['#e5e8eb']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' }
        }
      }
    });
  }

  function renderList(monthTxs) {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = monthTxs;

    if (appState.selectedDate) {
      filtered = filtered.filter(t => t.date === appState.selectedDate);
    }
    if (keyword) {
      filtered = filtered.filter(t =>
        t.desc.toLowerCase().includes(keyword) || t.category.toLowerCase().includes(keyword)
      );
    }

    document.getElementById('txCountBadge').textContent = `총 ${filtered.length}건`;
    const container = document.getElementById('txListContainer');

    if (filtered.length === 0) {
      container.innerHTML = `<p style="text-align:center; color:var(--text-sub); padding: 40px 0;">표시할 거래 내역이 없습니다.</p>`;
      return;
    }

    container.innerHTML = filtered.map(t => `
      <div class="tx-item">
        <div class="tx-left">
          <span class="tx-title">${t.desc}</span>
          <span class="tx-meta">${t.date} · ${t.category}</span>
        </div>
        <div class="tx-right">
          <span class="tx-amount ${t.type === 'income' ? 'text-income' : 'text-expense'}">
            ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()}원
          </span>
          <button class="del-btn" onclick="deleteTransaction(${t.id})" title="삭제">✕</button>
        </div>
      </div>
    `).join('');
  }
  // === 데이터 백업 (JSON 파일 다운로드) ===
function exportLedgerData() {
  // 현재 모아 가계부에서 사용 중인 데이터와 예산을 그대로 묶어서 저장
  const backupPayload = {
    transactions: typeof transactions !== 'undefined' ? transactions : [],
    monthlyBudget: typeof monthlyBudget !== 'undefined' ? monthlyBudget : 2500000,
    exportedAt: new Date().toISOString()
  };

  const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);

  a.href = url;
  a.download = `모아가계부_백업_${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// === 데이터 복원 (JSON 파일 불러오기) ===
function importLedgerData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const restoredTx = Array.isArray(parsed) ? parsed : parsed.transactions;

      if (!Array.isArray(restoredTx)) {
        alert('올바른 가계부 백업 파일(.json)이 아닙니다.');
        return;
      }

      // 1. 메모리 변수 업데이트
      if (typeof transactions !== 'undefined') transactions = restoredTx;
      if (parsed.monthlyBudget && typeof monthlyBudget !== 'undefined') {
        monthlyBudget = Number(parsed.monthlyBudget);
      }

      // 2. 로컬스토리지 모든 버전에 안전하게 동기화 저장
      ['smart_ledger_transactions_v2', 'smart_ledger_v2_tx', 'SMART_LEDGER_PERSISTENT_STORAGE'].forEach(key => {
        localStorage.setItem(key, JSON.stringify(restoredTx));
      });
      if (parsed.monthlyBudget) {
        ['smart_ledger_budget_v2', 'smart_ledger_v2_budget'].forEach(key => {
          localStorage.setItem(key, String(parsed.monthlyBudget));
        });
      }

      // 3. 기존 저장 함수나 렌더링 함수가 있으면 호출 후 새로고침
      if (typeof saveData === 'function') saveData();
      alert(`총 ${restoredTx.length}건의 가계부 내역이 성공적으로 복원되었습니다!`);
      location.reload();
    } catch (err) {
      alert('파일을 읽는 중 오류가 발생했습니다. 올바른 JSON 백업 파일인지 확인해주세요.');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}
</script>
