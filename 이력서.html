<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume & Portfolio Studio | 홍운해</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }

    /* Custom Scrollbars for Editor & Preview */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* A4 Paper Container in Preview */
    .resume-sheet {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    /* Print Media Query for clean A4 output */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      html, body {
        background: #ffffff !important;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      #app-layout,
      #preview-pane,
      #preview-scroll-container {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }
      .resume-sheet {
        max-width: 100% !important;
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        border: none !important;
      }
      .print-break-avoid {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      .print-page-break {
        break-before: page !important;
        page-break-before: always !important;
      }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none sm:select-auto">

  <!-- ==================== TOP TOOLBAR ==================== -->
  <header class="no-print bg-slate-900 text-white border-b border-slate-800 px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 z-30 shrink-0">
    <!-- Brand & Auto-save Badge -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-sm sm:text-base tracking-tight text-white">Resume & Portfolio Studio</h1>
            <span id="save-status" class="hidden md:inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              자동 저장됨
            </span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">실시간 이력서 · 기술 포트폴리오 빌더 & A4 퍼블리셔</p>
        </div>
      </div>
    </div>

    <!-- Center Controls: View Mode, Layout Mode, Theme Color -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Toggle Editor Button -->
      <button id="btn-toggle-editor" onclick="toggleEditorPane()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition">
        <svg id="icon-toggle-editor" class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span id="text-toggle-editor">편집 패널 숨기기</span>
      </button>

      <!-- Display Section Selector -->
      <div class="inline-flex items-center bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
        <button onclick="setDisplayMode('all')" id="mode-btn-all" class="px-2.5 py-1 rounded-md font-medium transition bg-blue-600 text-white">통합본</button>
        <button onclick="setDisplayMode('resume')" id="mode-btn-resume" class="px-2.5 py-1 rounded-md font-medium transition text-slate-300 hover:text-white">이력서만</button>
        <button onclick="setDisplayMode('portfolio')" id="mode-btn-portfolio" class="px-2.5 py-1 rounded-md font-medium transition text-slate-300 hover:text-white">포트폴리오만</button>
      </div>

      <!-- Theme Selector -->
      <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
        <span class="text-[11px] text-slate-400 hidden lg:inline mr-1">테마</span>
        <button onclick="setTheme('navy')" title="네이비 슬레이트" id="theme-btn-navy" class="w-4 h-4 rounded-full bg-[#1e3a8a] ring-2 ring-offset-2 ring-offset-slate-900 ring-blue-400 transition"></button>
        <button onclick="setTheme('emerald')" title="에메랄드 시큐리티" id="theme-btn-emerald" class="w-4 h-4 rounded-full bg-[#065f46] hover:scale-110 transition"></button>
        <button onclick="setTheme('indigo')" title="모던 인디고" id="theme-btn-indigo" class="w-4 h-4 rounded-full bg-[#3730a3] hover:scale-110 transition"></button>
        <button onclick="setTheme('minimal')" title="블랙 미니멀" id="theme-btn-minimal" class="w-4 h-4 rounded-full bg-[#18181b] border border-slate-500 hover:scale-110 transition"></button>
      </div>
    </div>

    <!-- Right Action Buttons: JSON, Standalone HTML, Print -->
    <div class="flex items-center gap-1.5">
      <!-- JSON Backup / Restore Dropdown or Buttons -->
      <button onclick="exportJsonData()" title="작성 데이터를 JSON 파일로 백업" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span class="hidden xl:inline">JSON 저장</span>
      </button>

      <label title="백업된 JSON 파일 불러오기" class="cursor-pointer inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        <span class="hidden xl:inline">불러오기</span>
        <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="importJsonData(event)" />
      </label>

      <button onclick="openResetModal()" title="기본 샘플 데이터로 초기화" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-rose-950/60 hover:text-rose-300 hover:border-rose-800 text-slate-300 border border-slate-700 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="hidden 2xl:inline">초기화</span>
      </button>

      <!-- Export Clean Read-Only HTML -->
      <button onclick="downloadStandaloneHTML()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        <span>제출용 HTML 추출</span>
      </button>

      <!-- Print / Save A4 PDF -->
      <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-sm transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        <span>A4 인쇄 / PDF</span>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE (SPLIT VIEW) ==================== -->
  <div id="app-layout" class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- LEFT: EDITOR PANEL -->
    <aside id="editor-pane" class="no-print w-full lg:w-[460px] xl:w-[520px] bg-white border-b lg:border-b-0 lg:border-r border-slate-200 flex flex-col h-[48vh] lg:h-full shrink-0 transition-all duration-200 z-20">
      <!-- Editor Navigation Tabs -->
      <div class="bg-slate-50 border-b border-slate-200 px-3 pt-2.5 flex items-center gap-1 overflow-x-auto shrink-0">
        <button onclick="switchEditorTab('profile')" id="tab-btn-profile" class="editor-tab-btn px-3 py-2 text-xs font-bold rounded-t-lg border-b-2 border-blue-600 text-blue-600 bg-white whitespace-nowrap flex items-center gap-1.5">
          <span>1. 기본 프로필</span>
        </button>
        <button onclick="switchEditorTab('skills')" id="tab-btn-skills" class="editor-tab-btn px-3 py-2 text-xs font-semibold rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-slate-900 whitespace-nowrap flex items-center gap-1.5">
          <span>2. 기술 스택</span>
        </button>
        <button onclick="switchEditorTab('experience')" id="tab-btn-experience" class="editor-tab-btn px-3 py-2 text-xs font-semibold rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-slate-900 whitespace-nowrap flex items-center gap-1.5">
          <span>3. 경력 사항</span>
        </button>
        <button onclick="switchEditorTab('projects')" id="tab-btn-projects" class="editor-tab-btn px-3 py-2 text-xs font-semibold rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-slate-900 whitespace-nowrap flex items-center gap-1.5">
          <span>4. 포트폴리오(STAR)</span>
        </button>
        <button onclick="switchEditorTab('certs')" id="tab-btn-certs" class="editor-tab-btn px-3 py-2 text-xs font-semibold rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-slate-900 whitespace-nowrap flex items-center gap-1.5">
          <span>5. 자격·교육·강점</span>
        </button>
      </div>

      <!-- Editor Form Content Container -->
      <div id="editor-content" class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-5 bg-slate-50/50">
        <!-- Dynamically populated by JS -->
      </div>
    </aside>

    <main id="preview-pane" class="flex-1 bg-slate-200/75 overflow-hidden flex flex-col h-full">
      <!-- Quick Status / Guide Bar inside Preview -->
      <div class="no-print bg-white/80 backdrop-blur border-b border-slate-200/80 px-4 py-1.5 flex items-center justify-between text-xs text-slate-500 shrink-0">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-500"></span>
          <span>미리보기 영역의 각 섹션을 클릭하면 좌측 편집 탭으로 즉시 이동합니다.</span>
        </div>
        <div class="hidden sm:flex items-center gap-3 text-[11px]">
          <span>규격: <strong>A4 최적화 (210mm)</strong></span>
          <span>·</span>
          <span id="preview-mode-label" class="font-semibold text-slate-700">표시: 이력서 + 포트폴리오 통합</span>
        </div>
      </div>

      <!-- Scrollable Sheet Holder -->
      <div id="preview-scroll-container" class="flex-1 overflow-y-auto p-3 sm:p-6 md:p-8">
        <div id="resume-render-root" class="resume-sheet">
          <!-- Dynamically Rendered by renderPreview() -->
        </div>
      </div>
    </main>

  </div>

  <!-- ==================== CUSTOM MODAL (FOR RESET CONFIRMATION) ==================== -->
  <div id="confirm-modal" class="no-print fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

      </p>
      <div class="flex items-center justify-end gap-2">
        <button onclick="closeResetModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">취소</button>
        <button onclick="confirmResetData()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition">초기화 실행</button>
      </div>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div id="toast-container" class="no-print fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    // Application State
    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const defaults = getDefaultData();
          return {
            settings: { ...defaults.settings, ...(parsed.settings || {}) },
            profile: { ...defaults.profile, ...(parsed.profile || {}) },
            skillCategories: Array.isArray(parsed.skillCategories) ? parsed.skillCategories : defaults.skillCategories,
            experiences: Array.isArray(parsed.experiences) ? parsed.experiences : defaults.experiences,
            projects: Array.isArray(parsed.projects) ? parsed.projects : defaults.projects,
            extras: Array.isArray(parsed.extras) ? parsed.extras : defaults.extras
          };
        }
      } catch (e) {
        console.error('Failed to load state from localStorage:', e);
      }
      return getDefaultData();
    }

    function saveState(quiet = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (!quiet) {
          const badge = document.getElementById('save-status');
          if (badge) {
            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 자동 저장됨 (${new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })})`;
          }
        }
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // HTML Escape Helper to prevent XSS & broken attributes
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Toast Notification Helper (Replaces alert)
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-slate-900';
      toast.className = `${bgClass} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 border border-white/10 transition-all duration-300 opacity-0 translate-y-2`;
      toast.innerHTML = `
        <svg class="w-4 h-4 shrink-0 text-white/90" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>${esc(message)}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    // ==================== TOOLBAR CONTROLS ====================
    function toggleEditorPane(forceState) {
      state.settings.showEditor = typeof forceState === 'boolean' ? forceState : !state.settings.showEditor;
      applyToolbarUI();
      saveState(true);
    }

    function setDisplayMode(mode) {
      state.settings.displayMode = mode;
      applyToolbarUI();
      renderPreview();
      saveState();
    }

    function setTheme(themeKey) {
      if (!THEMES[themeKey]) return;
      state.settings.theme = themeKey;
      applyToolbarUI();
      renderPreview();
      saveState();
      showToast(`테마가 '${THEMES[themeKey].name}'(으)로 변경되었습니다.`);
    }

    function applyToolbarUI() {
      const editorPane = document.getElementById('editor-pane');
      const textToggle = document.getElementById('text-toggle-editor');
      if (state.settings.showEditor) {
        editorPane.classList.remove('hidden');
        textToggle.textContent = '편집 패널 숨기기';
      } else {
        editorPane.classList.add('hidden');
        textToggle.textContent = '편집 패널 열기';
      }

      // Display Mode Buttons
      ['all', 'resume', 'portfolio'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (!btn) return;
        if (state.settings.displayMode === m) {
          btn.className = 'px-2.5 py-1 rounded-md font-semibold transition bg-blue-600 text-white shadow-xs';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md font-medium transition text-slate-300 hover:text-white';
        }
      });

      const modeLabel = document.getElementById('preview-mode-label');
      if (modeLabel) {
        const labels = {
          all: '표시: 이력서 + 포트폴리오 통합',
          resume: '표시: 이력서 요약 단독',
          portfolio: '표시: 핵심 포트폴리오 상세 단독'
        };
        modeLabel.textContent = labels[state.settings.displayMode] || labels.all;
      }

      // Theme Buttons
      Object.keys(THEMES).forEach(k => {
        const btn = document.getElementById(`theme-btn-${k}`);
        if (!btn) return;
        if (state.settings.theme === k) {
          btn.classList.add('ring-2', 'ring-offset-2', 'ring-offset-slate-900', 'ring-blue-400', 'scale-110');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-slate-900', 'ring-blue-400', 'scale-110');
        }
      });
    }

      }
      const tabs = ['profile', 'skills', 'experience', 'projects', 'certs'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (!btn) return;
        if (t === tabName) {
          btn.className = 'editor-tab-btn px-3 py-2 text-xs font-bold rounded-t-lg border-b-2 border-blue-600 text-blue-600 bg-white whitespace-nowrap flex items-center gap-1.5';

        }

      renderEditorForm();
      saveState(true);
    }

      state.profile.metrics[idx][field] = value;

      saveState();

      saveState();

    function updateSkillTags(idx, rawValue) {

        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      renderPreview();
      saveState();
    }

      renderPreview();
      saveState();

        .filter(Boolean);

      saveState();

    function moveItem(listKey, idx, direction) {
      const list = state[listKey];
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[idx];
      list[idx] = list[targetIdx];
      list[targetIdx] = temp;
      renderEditorForm();
      renderPreview();
      saveState();
    }

    function removeItem(listKey, idx) {
      state[listKey].splice(idx, 1);
      renderEditorForm();
      renderPreview();
      saveState();
      showToast('항목이 삭제되었습니다.');
    }

        <div class="p-7 sm:p-10 space-y-8 bg-white text-slate-800">

          ${showResume ? `
            <!-- SECTION 1: TECHNICAL SKILLS -->

            <!-- SECTION 2: WORK EXPERIENCE -->

              <div class="flex items-center gap-2.5 pb-2 mb-4 border-b-2" style="border-color: ${theme.primary};">
                <span class="w-2 h-5 rounded-xs" style="background-color: ${theme.primary};"></span>
                <h2 class="text-base font-extrabold tracking-tight text-slate-900 uppercase">Professional Experience</h2>
                <span class="text-xs text-slate-400 font-medium ml-auto">경력 사항</span>

              <div class="space-y-5">
                ${state.experiences.map(exp => `
                  <div class="print-break-avoid pl-4 border-l-2 space-y-2" style="border-color: ${theme.primaryBorder};">

                      </div>
                      <span class="text-xs font-mono font-semibold text-slate-500">${esc(exp.period)}</span>
                    </div>
                    ${exp.summary ? `<p class="text-xs font-semibold text-slate-700 bg-slate-100/80 px-3 py-1.5 rounded-lg">${esc(exp.summary)}</p>` : ''}
                    <ul class="space-y-1 text-xs text-slate-700 leading-relaxed list-disc list-inside">
                      ${(exp.bullets || []).map(b => `<li>${esc(b)}</li>`).join('')}

              </div>
            </section>
          ` : ''}

          ${showPortfolio ? `
            <!-- SECTION 3: KEY PROJECTS & TROUBLESHOOTING PORTFOLIO (STAR) -->
            <section onclick="switchEditorTab('projects', true)" class="cursor-pointer">
              <div class="flex items-center gap-2.5 pb-2 mb-4 border-b-2" style="border-color: ${theme.primary};">
                <span class="w-2 h-5 rounded-xs" style="background-color: ${theme.primary};"></span>
                <h2 class="text-base font-extrabold tracking-tight text-slate-900 uppercase">Key Projects & Troubleshooting Portfolio</h2>
                <span class="text-xs text-slate-400 font-medium ml-auto">핵심 트러블슈팅 및 엔지니어링 사례 (STAR)</span>
              </div>

              <div class="space-y-5">
                ${state.projects.map((proj, idx) => `
                  <div class="print-break-avoid rounded-xl border border-slate-200 overflow-hidden shadow-2xs bg-white">
                    <!-- Project Header -->
                    <div class="px-4 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2" style="background-color: ${theme.primaryLight};">
                      <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 text-[11px] font-extrabold rounded text-white" style="background-color: ${theme.primary};">CASE 0${idx + 1}</span>
                        <h3 class="text-sm font-extrabold text-slate-900">${esc(proj.title)}</h3>
                      </div>
                      <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-600">
                        <span>${esc(proj.category)}</span>
                        ${proj.period ? `<span>·</span><span>${esc(proj.period)}</span>` : ''}
                      </div>
                    </div>

                    <!-- STAR Body -->
                    <div class="p-4 space-y-3 text-xs leading-relaxed">
                      <!-- Situation / Issue -->
                      <div class="p-3 rounded-lg border" style="background-color: ${theme.starS.bg}; border-color: ${theme.starS.border};">
                        <div class="font-extrabold text-[11px] uppercase tracking-wider mb-1 flex items-center gap-1.5" style="color: ${theme.starS.text};">
                          <span>[Situation & Issue] 배경 및 발생 이슈</span>
                        </div>
                        <p class="text-slate-800 whitespace-pre-line">${esc(proj.situation)}</p>
                      </div>

                      <!-- Action -->
                      <div class="p-3 rounded-lg border" style="background-color: ${theme.starA.bg}; border-color: ${theme.starA.border};">
                        <div class="font-extrabold text-[11px] uppercase tracking-wider mb-1 flex items-center gap-1.5" style="color: ${theme.starA.text};">
                          <span>[Action & Analysis] 패킷·아키텍처 분석 및 해결 과정</span>
                        </div>
                        <p class="text-slate-800 whitespace-pre-line">${esc(proj.action)}</p>
                      </div>

                      <!-- Result -->
                      <div class="p-3 rounded-lg border" style="background-color: ${theme.starR.bg}; border-color: ${theme.starR.border};">
                        <div class="font-extrabold text-[11px] uppercase tracking-wider mb-1 flex items-center gap-1.5" style="color: ${theme.starR.text};">
                          <span>[Result & Impact] 적용 결과 및 성과</span>
                        </div>
                        <p class="text-slate-900 font-medium whitespace-pre-line">${esc(proj.result)}</p>
                      </div>

                      <!-- Tech Stack Footer -->
                      <div class="pt-1 flex flex-wrap items-center gap-1.5">
                        <span class="text-[11px] font-bold text-slate-400 mr-1">적용 기술:</span>
                        ${(proj.techStack || []).map(t => `
                          <span class="px-2 py-0.5 text-[11px] font-mono font-semibold rounded bg-slate-100 text-slate-700 border border-slate-200">${esc(t)}</span>

                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${showResume ? `
            <!-- SECTION 4: STRENGTHS, CERTIFICATIONS & ADDITIONAL INFO -->
            <section onclick="switchEditorTab('certs', true)" class="cursor-pointer print-break-avoid">
              <div class="flex items-center gap-2.5 pb-2 mb-4 border-b-2" style="border-color: ${theme.primary};">
                <span class="w-2 h-5 rounded-xs" style="background-color: ${theme.primary};"></span>
                <h2 class="text-base font-extrabold tracking-tight text-slate-900 uppercase">Engineering Value & Credentials</h2>
                <span class="text-xs text-slate-400 font-medium ml-auto">핵심 강점 · 자격 · 전문성</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                ${state.extras.map(item => `
                  <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-1.5 print-break-avoid">
                    <div class="flex items-center justify-between text-[11px]">
                      <span class="px-2 py-0.5 rounded font-bold" style="background-color: ${theme.primaryLight}; color: ${theme.primary};">${esc(item.type)}</span>
                      <span class="font-mono text-slate-400 font-semibold">${esc(item.date)}</span>
                    </div>
                    <h3 class="text-xs font-extrabold text-slate-900 pt-1">${esc(item.title)}</h3>
                    <div class="text-[11px] font-semibold text-slate-500">${esc(item.organization)}</div>
                    <p class="text-xs text-slate-600 leading-relaxed pt-1">${esc(item.detail)}</p>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

        </div>
      `;
    }

    function renderPreview() {
      const root = document.getElementById('resume-render-root');
      if (!root) return;
      root.innerHTML = buildDocumentInnerHTML();
    }

    // ==================== FILE I/O: JSON EXPORT / IMPORT / RESET ====================
    function exportJsonData() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safeName = (state.profile.name || 'resume').replace(/\s+/g, '_');
      a.href = url;
      a.download = `${safeName}_이력서_포트폴리오_백업.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('JSON 백업 파일이 다운로드되었습니다.', 'success');
    }

    function importJsonData(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.profile || !Array.isArray(imported.projects)) {
            showToast('올바른 이력서/포트폴리오 JSON 포맷이 아닙니다.', 'warning');
            return;
          }
          const defaults = getDefaultData();
          state = {
            settings: { ...defaults.settings, ...(imported.settings || {}) },
            profile: { ...defaults.profile, ...(imported.profile || {}) },
            skillCategories: imported.skillCategories || defaults.skillCategories,
            experiences: imported.experiences || defaults.experiences,
            projects: imported.projects || defaults.projects,
            extras: imported.extras || defaults.extras
          };
          applyToolbarUI();
          renderEditorForm();
          renderPreview();
          saveState();
          showToast('JSON 데이터를 성공적으로 불러왔습니다!', 'success');
        } catch (err) {
          console.error(err);
          showToast('JSON 파일 파싱 중 오류가 발생했습니다.', 'warning');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function openResetModal() {
      const modal = document.getElementById('confirm-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeResetModal() {
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmResetData() {
      state = getDefaultData();
      localStorage.removeItem(STORAGE_KEY);
      closeResetModal();
      applyToolbarUI();
      renderEditorForm();
      renderPreview();
      saveState();
      showToast('홍운해 엔지니어 기본 샘플 데이터로 초기화되었습니다.', 'success');
    }

    // ==================== STANDALONE READ-ONLY HTML EXPORT ====================
    function downloadStandaloneHTML() {
      // Remove editor-click handlers from exported HTML
      const renderedContent = buildDocumentInnerHTML(state.settings.displayMode)
        .replace(/onclick="switchEditorTab\([^"]*\)"/g, '');

      const safeName = (state.profile.name || '홍운해').replace(/\s+/g, '_');
      const standaloneMarkup = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(state.profile.name)} | ${esc(state.profile.title)} - 이력서 및 포트폴리오</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .resume-sheet {
      width: 100%;
      max-width: 210mm;
      margin: 2rem auto;
      background: #ffffff;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      html, body {
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .resume-sheet {
        max-width: 100% !important;
        margin: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      .print-break-avoid {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body class="py-4 px-3 sm:px-6">
  <div class="no-print max-w-[210mm] mx-auto mb-3 flex items-center justify-between bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow">
    <div class="text-xs font-semibold">${esc(state.profile.name)} · 이력서 및 기술 포트폴리오</div>
    <button onclick="window.print()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition">A4 인쇄 / PDF 저장</button>
  </div>
  <main class="resume-sheet">
    ${renderedContent}
  </main>
</body>
</html>`;

      const blob = new Blob([standaloneMarkup], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${safeName}_이력서_및_포트폴리오.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('제출용 단독 HTML 파일이 다운로드되었습니다!', 'success');
    }

    // ==================== INITIALIZATION ====================
    window.onload = function() {
      applyToolbarUI();
      switchEditorTab(state.settings.activeTab || 'profile');
      renderPreview();
    };
  </script>
</body>
</html>
